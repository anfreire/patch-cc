[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patch-cc"
# Read from `patch_cc.__version__`, which is the one home: the manifest every
# patched bundle ends with records that value, so a second copy here could have
# `status` name a release PyPI never shipped.
dynamic = ["version"]
description = "Interactive patcher for the Claude Code native binary"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "André Freire Ferreira", email = "anfreire.dev@gmail.com" },
]
keywords = ["claude", "claude-code", "models", "proxy", "patch", "bun", "cli", "tui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=13.7",
    "blessed>=1.47.0",
    "lief>=0.15; sys_platform == 'darwin'",
    # How the bundle is located in and checked before writing
    # (src/patch_cc/js.py). No Node or Bun runtime is involved: the grammar is a
    # C library, shipped by `tree-sitter-javascript` as one abi3 wheel per
    # platform. `tree-sitter` itself is not abi3 -- it builds a wheel per
    # CPython version -- so an interpreter it has not published for compiles the
    # sdist instead, which needs a C toolchain. Every version `requires-python`
    # admits is covered today; a new CPython is what changes that, not a release
    # of ours.
    "tree-sitter>=0.25",
    "tree-sitter-javascript>=0.23",
]

[project.scripts]
patch-cc = "patch_cc.cli:main"

[project.urls]
Homepage = "https://github.com/anfreire/patch-cc"
Repository = "https://github.com/anfreire/patch-cc"
Issues = "https://github.com/anfreire/patch-cc/issues"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "ruff>=0.4",
]

[tool.mypy]
python_version = "3.11"

# lief is a macOS-only dependency, so it is absent when checking on Linux.
[[tool.mypy.overrides]]
module = "lief.*"
ignore_missing_imports = true

[tool.hatch.version]
path = "src/patch_cc/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/patch_cc"]
