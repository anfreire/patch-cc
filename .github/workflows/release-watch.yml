name: Release watch

# Runs `patch-cc doctor` on each Claude Code build as it ships. A build that
# passes is appended to docs/corpus.md on main; the first that fails gets an
# issue with doctor's report, and the watch waits until that issue is closed.

on:
  schedule:
    # Every 10 minutes. GitHub delays scheduled runs under load, so read this as
    # "within ~10-25 min of a release", not as a guarantee.
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: release-watch
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  # The installer's release channel, as scripts/corpus.py reads it.
  CHANNEL: https://downloads.claude.ai/claude-code-releases/latest

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Has a build shipped past the table?
        id: due
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Warnings, not failures: a failed run notifies, and a flaky read is not news.
          if ! head=$(curl -fsSL --max-time 30 --retry 3 --retry-delay 5 "$CHANNEL"); then
            echo "::warning::could not reach the release channel"
            exit 0
          fi
          head=$(printf '%s' "$head" | tr -d '[:space:]')
          if ! [[ $head =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::warning::the release channel answered '$head', not a version"
            exit 0
          fi
          last=$(grep -oE '^\| `[0-9]+\.[0-9]+\.[0-9]+`' docs/corpus.md | tr -d '|` ' | sort -V | tail -1)
          if [ "$(printf '%s\n' "$head" "$last" | sort -V | tail -1)" = "$last" ]; then
            echo "the channel is at $head and the table ends at $last"
            exit 0
          fi
          if ! open=$(gh issue list --repo "$GITHUB_REPOSITORY" --author 'github-actions[bot]' --state open --json number --jq '.[0].number // empty'); then
            echo "::warning::could not read the open issues"
            exit 0
          fi
          if [ -n "$open" ]; then
            echo "the channel is at $head, past $last, and #$open is open"
            exit 0
          fi
          IFS=. read -r major minor patch <<< "$last"
          echo "since=$major.$minor.$((patch + 1))" | tee -a "$GITHUB_OUTPUT"

      - if: steps.due.outputs.since
        uses: astral-sh/setup-uv@v6

      - name: Fetch, test and record each build
        id: test
        if: steps.due.outputs.since
        env:
          SINCE: ${{ steps.due.outputs.since }}
        run: |
          set -euo pipefail
          uv run scripts/corpus.py sync --since "$SINCE"
          corpus=$(uv run python -c 'from patch_cc.patcher import backup_dir; print(backup_dir())')
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          shopt -s nullglob
          for build in $(printf '%s\n' "$corpus"/*.orig | sort -V); do
            version=$(basename "$build" .orig)
            if ! uv run patch-cc doctor "$build" 2>&1 | tee "$RUNNER_TEMP/report"; then
              echo "broken=$version" >> "$GITHUB_OUTPUT"
              break
            fi
            size=$(awk -v bytes="$(stat -c %s "$build")" 'BEGIN { printf "%.0f", bytes / 1e6 }')
            sum=$(sha256sum "$build" | cut -d' ' -f1)
            end=$(grep -n '^| `[0-9]' docs/corpus.md | tail -1 | cut -d: -f1)
            sed -i "${end}a | \`$version\` | $size MB | \`$sum\` |" docs/corpus.md
            git commit -qm "docs(corpus): add $version" docs/corpus.md
          done
          git push || { git pull -q --rebase && git push; }

      - name: Report the build doctor fails on
        if: steps.test.outputs.broken
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.test.outputs.broken }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "\`patch-cc doctor\` fails on Claude Code $VERSION at $GITHUB_SHA ([run]($RUN_URL)):"
            echo
            echo '```'
            cat "$RUNNER_TEMP/report"
            echo '```'
            echo
            echo "The watch waits while this is open. Closing it tests again, against main as it is then."
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Claude Code $VERSION: doctor fails" --body-file "$RUNNER_TEMP/issue.md"
